name: Test tap

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out the tap
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Tap the checked-out workspace
        run: brew tap Demonbane18/relmio "$GITHUB_WORKSPACE"

      - name: Audit the formula
        run: brew audit --strict Demonbane18/relmio/relmio

      - name: Install from this tap
        run: brew install Demonbane18/relmio/relmio

      - name: Smoke-test the installed command
        run: |
          expected_version="$(
            brew info --json=v2 Demonbane18/relmio/relmio |
              ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("formulae").fetch(0).fetch("versions").fetch("stable")'
          )"
          test -n "$expected_version"
          test "$(relmio --version)" = "$expected_version"
          brew test Demonbane18/relmio/relmio
